version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: citadel-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./telemetry.db
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    container_name: citadel-agent
    command: python generator.py --chaos-mode
    environment:
      BACKEND_URL: http://backend:8000
      CHAOS_MODE: "true"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: citadel-frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
