version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /data/telemetry.db
      CORS_ORIGINS: http://localhost:5173
      AUTO_HEAL_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - citadel-data:/data
    restart: unless-stopped

  agent:
    build: ./agent
    command: python generator.py --chaos-mode
    environment:
      BACKEND_URL: http://backend:8000
      CHAOS_MODE: "true"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  citadel-data:
